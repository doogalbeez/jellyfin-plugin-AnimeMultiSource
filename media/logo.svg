<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2756"/>
      <stop offset="60%" stop-color="#29357a"/>
      <stop offset="100%" stop-color="#3d2c86"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#8fa3ff"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 H 0 V 16" fill="none" stroke="#4fd8ff" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <radialGradient id="glass" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a5ca8"/>
      <stop offset="100%" stop-color="#1f2a5e"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8da"/>
      <stop offset="100%" stop-color="#f0cdb8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb366"/>
      <stop offset="55%" stop-color="#ec7a33"/>
      <stop offset="100%" stop-color="#b9471d"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#bff4ff"/>
      <stop offset="40%" stop-color="#2fb6f0"/>
      <stop offset="100%" stop-color="#1d2f8a"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c7ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e4677"/>
      <stop offset="50%" stop-color="#6c76b4"/>
      <stop offset="100%" stop-color="#3e4677"/>
    </linearGradient>
    <pattern id="houndstooth" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#3b2a6a"/>
      <path d="M0 0 h12 v12 h-12 Z M12 12 h12 v12 h-12 Z" fill="#241a45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens"><circle cx="400" cy="400" r="196"/></clipPath>
    <clipPath id="rightHalf"><rect x="400" y="180" width="220" height="440"/></clipPath>
    <clipPath id="lensL"><circle cx="356" cy="424" r="40"/></clipPath>

    <!-- original boy-detective, front view -->
    <path id="faceShape" d="M 310 352 C 306 452, 340 530, 400 560 C 460 530, 494 452, 490 352 C 470 318, 330 318, 310 352 Z"/>
    <path id="backHair" d="M 268 364 C 246 214, 554 214, 532 364 L 530 446 C 516 424, 506 402, 498 382 L 302 382 C 294 402, 284 424, 270 446 Z"/>
    <path id="cowlick" d="M 404 236 C 420 186, 462 172, 478 194 C 452 194, 432 210, 422 240 Z"/>
    <path id="bangs" d="M 284 334 C 298 248, 502 248, 516 334 L 508 386 L 482 338 L 470 394 L 442 330 L 422 386 L 404 326 L 380 388 L 360 334 L 338 394 L 318 342 L 298 388 Z"/>
    <path id="eyeL" d="M 318 432 C 320 402, 386 394, 394 420 C 392 448, 330 454, 318 432 Z"/>
    <path id="eyeR" d="M 482 432 C 480 402, 414 394, 406 420 C 408 448, 470 454, 482 432 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.07"/>
  <path d="M 0 900 L 0 640 L 760 0 L 1200 0 L 1200 120 L 300 900 Z" fill="#ffffff" opacity="0.025"/>

  <!-- data lines feeding the lens -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 0 180 H 120 L 180 240 H 272" stroke="#00A4DC"/>
    <path d="M 0 300 H 150 L 190 330 H 208" stroke="#AA5CC3"/>
    <path d="M 0 470 H 140 L 175 445 H 206" stroke="#ff8a9b"/>
  </g>
  <g>
    <circle cx="120" cy="180" r="9" fill="#00A4DC"/>
    <circle cx="150" cy="300" r="9" fill="#AA5CC3"/>
    <circle cx="140" cy="470" r="9" fill="#ff8a9b"/>
  </g>

  <!-- handle -->
  <g transform="rotate(45 400 400)">
    <rect x="372" y="620" width="56" height="250" rx="22" fill="url(#handle)"/>
    <rect x="372" y="680" width="56" height="120" fill="url(#houndstooth)"/>
    <rect x="364" y="596" width="72" height="40" rx="10" fill="#6c76b4"/>
  </g>

  <!-- lens -->
  <circle cx="400" cy="400" r="232" fill="#00A4DC" opacity="0.22" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="196" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <!-- ===== original detective, head turned and tilted down, thinking hard ===== -->
    <g transform="translate(400 404) scale(0.84) translate(-400 -430) rotate(-7 400 430)">
      <!-- captain's coat with gold trim over an open white shirt -->
      <path d="M 196 660 L 250 566 L 356 540 L 400 660 Z" fill="#2f3f8f"/>
      <path d="M 604 660 L 552 562 L 448 538 L 404 660 Z" fill="#2f3f8f"/>
      <path d="M 356 540 L 400 610 L 448 538 L 446 660 L 356 660 Z" fill="#f7f8fc"/>
      <path d="M 378 556 L 400 610 L 424 556" fill="none" stroke="#d9dcea" stroke-width="3"/>
      <path d="M 250 566 L 356 540 L 400 660" fill="none" stroke="#f5c542" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 552 562 L 448 538 L 404 660" fill="none" stroke="#f5c542" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 236 590 L 300 572" stroke="#f5c542" stroke-width="5" stroke-linecap="round"/>
      <path d="M 566 588 L 502 570" stroke="#f5c542" stroke-width="5" stroke-linecap="round"/>
      <!-- neck -->
      <path d="M 378 520 L 440 520 L 446 586 L 384 586 Z" fill="#d9ad96"/>

      <!-- hair mass behind -->
      <path d="M 284 408 C 254 340, 262 270, 300 240 C 334 210, 380 198, 420 202 C 472 206, 522 230, 542 274 C 558 312, 552 364, 528 412 L 512 404 C 472 332, 340 328, 296 404 Z" fill="url(#hair)"/>
      <g fill="url(#hair)">
        <path d="M 270 300 L 236 290 L 268 336 Z"/>
        <path d="M 544 318 L 576 312 L 548 352 Z"/>
      </g>
      <!-- ear (near side) -->
      <ellipse cx="510" cy="440" rx="16" ry="26" fill="#e9c4ae"/>
      <path d="M 512 428 C 504 434, 504 448, 512 454" fill="none" stroke="#c48f78" stroke-width="3" stroke-linecap="round"/>
      <circle cx="508" cy="468" r="8" fill="none" stroke="#f5c542" stroke-width="4"/>
      <!-- face, three-quarter view -->
      <path id="face3q" d="M 300 362 C 294 442, 318 502, 370 540 C 394 556, 422 554, 442 538 C 488 502, 508 452, 506 384 C 482 334, 330 322, 300 362 Z" fill="url(#skin)"/>
      <path d="M 300 362 C 296 436, 316 494, 352 528 C 330 492, 318 440, 322 382 Z" fill="#d6a68e" opacity="0.45"/>
      <path d="M 302 356 L 506 380 L 504 420 C 450 402, 360 394, 302 404 Z" fill="#b98a7a" opacity="0.25"/>
      <!-- spiky bangs -->
      <path d="M 288 368 L 296 300 C 330 256, 470 252, 518 314 L 512 380 L 494 340 L 482 396 L 458 334 L 440 384 L 420 328 L 398 386 L 380 330 L 360 392 L 344 336 L 322 394 L 314 344 Z" fill="url(#hair)"/>
      
      <!-- pirate bandana -->
      <path d="M 520 318 C 548 326, 572 352, 578 384 C 566 370, 552 360, 538 356 Z" fill="#1f9fae"/>
      <path d="M 522 326 C 552 344, 566 380, 560 414 C 552 392, 540 374, 526 362 Z" fill="#2bb8c8"/>
      <path d="M 282 340 C 272 254, 334 212, 406 210 C 478 210, 534 252, 526 336 C 470 316, 338 316, 282 340 Z" fill="#2bb8c8"/>
      <path d="M 282 340 C 338 316, 470 316, 526 336" fill="none" stroke="#1a8b98" stroke-width="9" stroke-linecap="round"/>
      <path d="M 320 250 C 360 226, 430 222, 470 236" fill="none" stroke="#9ff0f7" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <circle cx="526" cy="330" r="15" fill="#1f9fae"/>
      <g transform="translate(404 270)">
        <path d="M -22 18 L 22 34 M 22 18 L -22 34" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="17" fill="#ffffff"/>
        <rect x="-9" y="10" width="18" height="11" rx="3" fill="#ffffff"/>
        <circle cx="-6" cy="-1" r="4.5" fill="#1a8b98"/><circle cx="6" cy="-1" r="4.5" fill="#1a8b98"/>
        <path d="M -4 16 v 5 M 0 16 v 5 M 4 16 v 5" stroke="#1a8b98" stroke-width="1.6"/>
      </g>

      <!-- confident brows -->
      <path d="M 316 390 C 334 380, 360 382, 380 394 L 377 402 C 358 392, 336 390, 318 400 Z" fill="#a13d17"/>
      <path d="M 486 384 C 466 374, 440 376, 420 390 L 423 398 C 442 386, 466 384, 484 394 Z" fill="#a13d17"/>

      <!-- wide, intense eyes with small pupils glancing sideways -->
      <ellipse cx="346" cy="436" rx="24" ry="28" fill="#ffffff"/>
      <ellipse cx="448" cy="438" rx="29" ry="32" fill="#ffffff"/>
      <circle cx="347" cy="438" r="9" fill="#0a0f2a"/>
      <circle cx="448" cy="440" r="10" fill="#0a0f2a"/>
      <circle cx="343" cy="434" r="3" fill="#ffffff"/>
      <circle cx="444" cy="435" r="3.5" fill="#ffffff"/>
      <path d="M 320 430 C 326 406, 366 404, 372 428" fill="none" stroke="#0a0f2a" stroke-width="6" stroke-linecap="round"/>
      <path d="M 418 430 C 424 400, 474 400, 480 430" fill="none" stroke="#0a0f2a" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 324 452 C 334 464, 356 466, 368 456" fill="none" stroke="#0a0f2a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M 422 456 C 434 470, 462 472, 476 460" fill="none" stroke="#0a0f2a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

      <!-- nose (turned), pressed frown -->
      <path d="M 392 462 L 380 482 L 392 484" fill="none" stroke="#c48f78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 356 500 C 372 540, 432 544, 452 496 C 420 508, 388 508, 356 500 Z" fill="#8a2f2a" stroke="#5a1d1a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 360 502 C 388 510, 420 510, 449 499 L 446 510 C 420 518, 388 518, 363 511 Z" fill="#ffffff"/>
      <path d="M 384 528 C 396 534, 414 534, 426 526 C 414 522, 396 522, 384 528 Z" fill="#e66a5f"/>
      

    </g>

    <!-- ===== analysis: landmarks + tracking mesh (same tilt) ===== -->
    <g transform="translate(400 404) scale(0.84) translate(-400 -430) rotate(-7 400 430)">
      <g fill="none" stroke="#4fd8ff" stroke-width="1.8" opacity="0.55" stroke-linejoin="round">
        <path d="M 316 389 L 378 408 L 420 406 L 486 384"/>
        <path d="M 320 430 L 372 428 M 418 430 L 480 430"/>
        <path d="M 378 408 L 392 462 L 420 406"/>
        <path d="M 372 428 L 380 482 L 418 430"/>
        <path d="M 380 482 L 356 500 L 452 496 L 380 482"/>
        <path d="M 356 500 L 400 552 L 452 496"/>
        <path d="M 300 362 L 316 389 L 320 430 L 300 442 L 330 500 L 356 500"/>
        <path d="M 486 384 L 506 410 L 480 430 L 498 470 L 442 538 L 452 496"/>
        <path d="M 320 430 L 330 500 M 480 430 L 498 470"/>
      </g>
      <g fill="#d6f6ff">
        <circle cx="316" cy="389" r="5"/><circle cx="378" cy="408" r="5"/><circle cx="420" cy="406" r="5"/><circle cx="486" cy="384" r="5"/>
        <circle cx="320" cy="430" r="5"/><circle cx="372" cy="428" r="5"/><circle cx="418" cy="430" r="5"/><circle cx="480" cy="430" r="5"/>
        <circle cx="392" cy="462" r="4"/><circle cx="380" cy="482" r="5"/>
        <circle cx="356" cy="500" r="5"/><circle cx="452" cy="496" r="5"/><circle cx="400" cy="552" r="5"/>
        <circle cx="300" cy="362" r="4"/><circle cx="300" cy="442" r="4"/><circle cx="330" cy="500" r="4"/>
        <circle cx="506" cy="410" r="4"/><circle cx="498" cy="470" r="4"/><circle cx="442" cy="538" r="4"/>
        <circle cx="510" cy="440" r="4"/><circle cx="404" cy="270" r="4"/>
      </g>
      <!-- target lock on the near eye -->
      <g fill="none" stroke="#d6f6ff" stroke-width="3">
        <path d="M 408 396 h 14 M 408 396 v 14"/>
        <path d="M 490 396 h -14 M 490 396 v 14"/>
        <path d="M 408 480 h 14 M 408 480 v -14"/>
        <path d="M 490 480 h -14 M 490 480 v -14"/>
      </g>
    </g>

    <!-- scan band across the eye line -->
    <rect x="200" y="410" width="400" height="3" fill="#d6f6ff" opacity="0.9" filter="url(#lineglow)"/>
    <rect x="200" y="413" width="400" height="30" fill="#4fd8ff" opacity="0.08"/>

    <!-- glass glare -->
    <path d="M 252 262 C 292 222, 352 208, 402 212 C 352 224, 302 248, 272 292 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <circle cx="400" cy="400" r="196" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="400" cy="400" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>


  <!-- readout tagged to the face, outside the lens -->
  <g>
    <path d="M 468 382 L 548 252 L 566 252" fill="none" stroke="#d6f6ff" stroke-width="2.5"/>
    <circle cx="468" cy="382" r="5" fill="#d6f6ff"/>
    <rect x="566" y="222" width="104" height="58" rx="8" fill="#070b1c" opacity="0.9" stroke="#4fd8ff" stroke-width="2"/>
    <text x="578" y="246" font-family="DejaVu Sans Mono" font-weight="700" font-size="17" fill="#d6f6ff">MATCH</text>
    <text x="578" y="268" font-family="DejaVu Sans Mono" font-weight="700" font-size="17" fill="#4fd8ff">98.7%</text>
  </g>
  <!-- wordmark -->
  <text x="890" y="500" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="680" y="530" width="420" height="6" rx="3" fill="url(#ring)"/>
  <text x="890" y="600" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#c3cdf5">ANIME MULTI SOURCE</text>
</svg>
