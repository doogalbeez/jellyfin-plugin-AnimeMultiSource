<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f22"/>
      <stop offset="60%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#1e1244"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#8fa3ff"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 H 0 V 16" fill="none" stroke="#4fd8ff" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <radialGradient id="glass" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#26346a"/>
      <stop offset="100%" stop-color="#0a0e22"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6dfcf"/>
      <stop offset="100%" stop-color="#e6c1ab"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3870"/>
      <stop offset="100%" stop-color="#0c1026"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#bff4ff"/>
      <stop offset="40%" stop-color="#2fb6f0"/>
      <stop offset="100%" stop-color="#1d2f8a"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c7ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2f52"/>
      <stop offset="50%" stop-color="#4a5285"/>
      <stop offset="100%" stop-color="#2a2f52"/>
    </linearGradient>
    <pattern id="houndstooth" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#3b2a6a"/>
      <path d="M0 0 h12 v12 h-12 Z M12 12 h12 v12 h-12 Z" fill="#241a45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens"><circle cx="400" cy="400" r="196"/></clipPath>
    <clipPath id="rightHalf"><rect x="400" y="180" width="220" height="440"/></clipPath>
    <clipPath id="lensL"><circle cx="356" cy="424" r="40"/></clipPath>

    <!-- original boy-detective, front view -->
    <path id="faceShape" d="M 310 352 C 306 452, 340 530, 400 560 C 460 530, 494 452, 490 352 C 470 318, 330 318, 310 352 Z"/>
    <path id="backHair" d="M 268 364 C 246 214, 554 214, 532 364 L 530 446 C 516 424, 506 402, 498 382 L 302 382 C 294 402, 284 424, 270 446 Z"/>
    <path id="cowlick" d="M 404 236 C 420 186, 462 172, 478 194 C 452 194, 432 210, 422 240 Z"/>
    <path id="bangs" d="M 284 334 C 298 248, 502 248, 516 334 L 508 386 L 482 338 L 470 394 L 442 330 L 422 386 L 404 326 L 380 388 L 360 334 L 338 394 L 318 342 L 298 388 Z"/>
    <path id="eyeL" d="M 318 432 C 320 402, 386 394, 394 420 C 392 448, 330 454, 318 432 Z"/>
    <path id="eyeR" d="M 482 432 C 480 402, 414 394, 406 420 C 408 448, 470 454, 482 432 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.07"/>
  <path d="M 0 900 L 0 640 L 760 0 L 1200 0 L 1200 120 L 300 900 Z" fill="#ffffff" opacity="0.025"/>

  <!-- data lines feeding the lens -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 0 180 H 120 L 180 240 H 272" stroke="#00A4DC"/>
    <path d="M 0 300 H 150 L 190 330 H 208" stroke="#AA5CC3"/>
    <path d="M 0 470 H 140 L 175 445 H 206" stroke="#ff8a9b"/>
  </g>
  <g>
    <circle cx="120" cy="180" r="9" fill="#00A4DC"/>
    <circle cx="150" cy="300" r="9" fill="#AA5CC3"/>
    <circle cx="140" cy="470" r="9" fill="#ff8a9b"/>
  </g>

  <!-- handle -->
  <g transform="rotate(45 400 400)">
    <rect x="372" y="620" width="56" height="250" rx="22" fill="url(#handle)"/>
    <rect x="372" y="680" width="56" height="120" fill="url(#houndstooth)"/>
    <rect x="364" y="596" width="72" height="40" rx="10" fill="#4a5285"/>
  </g>

  <!-- lens -->
  <circle cx="400" cy="400" r="232" fill="#00A4DC" opacity="0.22" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="196" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <g transform="translate(400 392) scale(0.95) translate(-400 -426)">
      <!-- hair behind, neck, coat -->
      <use href="#backHair" fill="url(#hair)"/>
      <path d="M 372 540 L 428 540 L 432 612 L 368 612 Z" fill="#dcb39c"/>
      <path d="M 340 600 L 400 640 L 460 600 L 470 700 L 330 700 Z" fill="#f4f6fb"/>
      <path d="M 392 606 L 408 606 L 414 700 L 386 700 Z" fill="#f2a541"/>
      <path d="M 390 600 L 410 600 L 406 614 L 394 614 Z" fill="#d98a25"/>
      <path d="M 210 700 L 250 610 L 340 584 L 372 700 Z" fill="#2c3352"/>
      <path d="M 590 700 L 550 610 L 460 584 L 428 700 Z" fill="#2c3352"/>
      <path d="M 340 584 L 300 560 L 290 620 L 372 690 Z" fill="#3b4470"/>
      <path d="M 460 584 L 500 560 L 510 620 L 428 690 Z" fill="#3b4470"/>
      <!-- face -->
      <use href="#faceShape" fill="url(#skin)"/>
      <path d="M 310 352 C 310 440, 330 500, 360 534 C 340 498, 326 440, 328 372 Z" fill="#d6a68e" opacity="0.45"/>
      <path d="M 310 350 L 490 350 L 490 402 C 440 386, 360 386, 310 402 Z" fill="#b98a7a" opacity="0.28"/>
      <use href="#cowlick" fill="url(#hair)"/>
      <use href="#bangs" fill="url(#hair)"/>
      <path d="M 326 300 C 356 270, 430 262, 470 278" fill="none" stroke="#5f7fe0" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
      <!-- brows: one raised, confident -->
      <path d="M 320 392 C 340 372, 372 368, 390 378 L 388 386 C 370 378, 344 382, 322 400 Z" fill="#0c1026"/>
      <path d="M 480 398 C 460 384, 430 382, 410 386 L 412 394 C 430 390, 458 394, 478 406 Z" fill="#0c1026"/>
      <!-- eyes: big, bright, with highlights -->
      <use href="#eyeL" fill="#ffffff"/>
      <use href="#eyeR" fill="#ffffff"/>
      <ellipse cx="358" cy="426" rx="20" ry="25" fill="url(#iris)"/>
      <ellipse cx="442" cy="426" rx="20" ry="25" fill="url(#iris)"/>
      <ellipse cx="358" cy="428" rx="8" ry="12" fill="#0a0f2a"/>
      <ellipse cx="442" cy="428" rx="8" ry="12" fill="#0a0f2a"/>
      <circle cx="350" cy="414" r="6.5" fill="#ffffff"/><circle cx="367" cy="438" r="3" fill="#ffffff"/>
      <circle cx="434" cy="414" r="6.5" fill="#ffffff"/><circle cx="451" cy="438" r="3" fill="#ffffff"/>
      <path d="M 312 434 C 316 398, 386 388, 398 416 L 393 422 C 382 400, 326 404, 320 436 Z" fill="#0a0f2a"/>
      <path d="M 488 434 C 484 398, 414 388, 402 416 L 407 422 C 418 400, 474 404, 480 436 Z" fill="#0a0f2a"/>
      <path d="M 314 432 L 300 418 L 320 424 Z" fill="#0a0f2a"/>
      <path d="M 486 432 L 500 418 L 480 424 Z" fill="#0a0f2a"/>
      <!-- round glasses with the detective glint -->
      <g fill="none" stroke="#dfe6ff" stroke-width="4.5">
        <circle cx="356" cy="424" r="40"/>
        <circle cx="444" cy="424" r="40"/>
        <path d="M 396 418 C 398 410, 402 410, 404 418"/>
        <path d="M 316 418 L 300 410"/><path d="M 484 418 L 500 410"/>
      </g>
      <g clip-path="url(#lensL)">
        <path d="M 318 448 L 370 380 L 392 380 L 340 448 Z" fill="#ffffff" opacity="0.42"/>
        <path d="M 346 452 L 396 388 L 404 388 L 354 452 Z" fill="#ffffff" opacity="0.28"/>
      </g>
      <!-- nose, smirk -->
      <path d="M 401 470 L 396 482" fill="none" stroke="#c48f78" stroke-width="3" stroke-linecap="round"/>
      <path d="M 380 508 C 392 514, 406 512, 420 500" fill="none" stroke="#9a5f52" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ===== analysis overlay on the right half ===== -->
    <g clip-path="url(#rightHalf)">
      <rect x="400" y="180" width="220" height="440" fill="#070b1c" opacity="0.93"/>
      <rect x="400" y="180" width="220" height="440" fill="url(#grid)" opacity="0.2"/>
      <g transform="translate(400 392) scale(0.95) translate(-400 -426)">
        <g fill="none" stroke="#4fd8ff" stroke-width="2.5" filter="url(#lineglow)">
          <use href="#backHair" stroke-opacity="0.5"/>
          <use href="#faceShape"/>
          <use href="#bangs" stroke-opacity="0.7"/>
          <use href="#cowlick" stroke-opacity="0.7"/>
          <use href="#eyeR"/>
          <ellipse cx="442" cy="426" rx="20" ry="25"/>
          <circle cx="444" cy="424" r="40" stroke-opacity="0.8"/>
          <path d="M 480 398 C 460 384, 430 382, 410 386 L 412 394 C 430 390, 458 394, 478 406 Z"/>
          <path d="M 401 470 L 396 482"/>
          <path d="M 380 508 C 392 514, 406 512, 420 500"/>
          <path d="M 460 584 L 500 560 L 510 620 L 428 690"/>
          <path d="M 590 700 L 550 610 L 460 584"/>
        </g>
        <g fill="none" stroke="#4fd8ff" stroke-width="1.5" opacity="0.45">
          <path d="M 400 370 C 440 368, 472 372, 490 380"/>
          <path d="M 400 462 C 440 462, 472 456, 488 446"/>
          <path d="M 400 496 C 432 496, 462 488, 480 476"/>
          <path d="M 400 530 C 422 530, 446 522, 460 510"/>
          <path d="M 440 352 C 448 420, 446 500, 428 548"/>
          <path d="M 472 356 C 480 420, 476 480, 460 514"/>
        </g>
        <g fill="#d6f6ff">
          <circle cx="406" cy="420" r="5"/><circle cx="482" cy="432" r="5"/><circle cx="442" cy="426" r="5"/>
          <circle cx="396" cy="482" r="5"/><circle cx="420" cy="500" r="5"/><circle cx="400" cy="560" r="5"/>
          <circle cx="480" cy="476" r="5"/><circle cx="490" cy="352" r="5"/><circle cx="460" cy="510" r="5"/>
          <circle cx="478" cy="194" r="5"/>
        </g>
        <g fill="none" stroke="#d6f6ff" stroke-width="3">
          <path d="M 400 380 h 14 M 400 380 v 14"/>
          <path d="M 492 380 h -14 M 492 380 v 14"/>
          <path d="M 400 470 h 14 M 400 470 v -14"/>
          <path d="M 492 470 h -14 M 492 470 v -14"/>
        </g>
      </g>
      <text x="492" y="404" font-family="DejaVu Sans Mono" font-weight="700" font-size="15" fill="#d6f6ff">MATCH</text>
      <text x="492" y="422" font-family="DejaVu Sans Mono" font-weight="700" font-size="15" fill="#4fd8ff">98.7%</text>
      <rect x="492" y="476" width="62" height="5" fill="#4fd8ff" opacity="0.8"/>
      <rect x="492" y="488" width="44" height="5" fill="#4fd8ff" opacity="0.5"/>
      <rect x="492" y="500" width="54" height="5" fill="#4fd8ff" opacity="0.3"/>
    </g>

    <!-- scan line splitting the face -->
    <rect x="397" y="190" width="6" height="420" fill="#d6f6ff" filter="url(#lineglow)"/>
    <rect x="403" y="190" width="40" height="420" fill="#4fd8ff" opacity="0.08"/>

    <!-- glass glare -->
    <path d="M 252 262 C 292 222, 352 208, 402 212 C 352 224, 302 248, 272 292 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <circle cx="400" cy="400" r="196" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="400" cy="400" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- wordmark -->
  <text x="890" y="500" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="680" y="530" width="420" height="6" rx="3" fill="url(#ring)"/>
  <text x="890" y="600" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#9fb0e6">ANIME MULTI SOURCE</text>
</svg>
