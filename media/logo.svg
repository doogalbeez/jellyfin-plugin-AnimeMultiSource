<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040b08"/>
      <stop offset="55%" stop-color="#08170f"/>
      <stop offset="100%" stop-color="#0d2419"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#6dffb0"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 H 0 V 16" fill="none" stroke="#2bd67b" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bd67b"/>
      <stop offset="100%" stop-color="#0b6b47"/>
    </linearGradient>
    <radialGradient id="glass" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#123326"/>
      <stop offset="100%" stop-color="#030a07"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6dccf"/>
      <stop offset="100%" stop-color="#a9b8a8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4734"/>
      <stop offset="100%" stop-color="#07140e"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#c8ffe0"/>
      <stop offset="45%" stop-color="#2bd67b"/>
      <stop offset="100%" stop-color="#0a4a30"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fff7"/>
      <stop offset="100%" stop-color="#9fe8bf"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2219"/>
      <stop offset="50%" stop-color="#2a4a3a"/>
      <stop offset="100%" stop-color="#0f2219"/>
    </linearGradient>
    <pattern id="houndstooth" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#1f4a36"/>
      <path d="M0 0 h12 v12 h-12 Z M12 12 h12 v12 h-12 Z" fill="#0c2018"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens"><circle cx="400" cy="400" r="196"/></clipPath>
    <clipPath id="rightHalf"><rect x="400" y="180" width="220" height="440"/></clipPath>

    <!-- shared face geometry (front view, original character) -->
    <path id="faceShape" d="M 312 362 C 310 462, 346 532, 400 570 C 454 532, 490 462, 488 362 C 468 330, 332 330, 312 362 Z"/>
    <path id="backHair" d="M 262 342 C 250 214, 550 214, 538 342 L 548 538 C 520 510, 500 470, 492 430 L 308 430 C 300 470, 280 510, 252 538 Z"/>
    <path id="bangs" d="M 284 318 C 316 246, 484 246, 516 318 L 506 396 L 476 344 L 458 404 L 430 338 L 404 400 L 380 340 L 352 406 L 330 348 L 300 398 Z"/>
    <path id="eyeL" d="M 318 432 C 330 412, 372 406, 390 420 C 380 440, 338 446, 318 432 Z"/>
    <path id="eyeR" d="M 482 432 C 470 412, 428 406, 410 420 C 420 440, 462 446, 482 432 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.06"/>
  <path d="M 0 900 L 0 640 L 760 0 L 1200 0 L 1200 120 L 300 900 Z" fill="#9dffc8" opacity="0.02"/>

  <!-- data lines feeding the lens -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 0 180 H 120 L 180 240 H 272" stroke="#2bd67b"/>
    <path d="M 0 300 H 150 L 190 330 H 208" stroke="#7dffb8"/>
    <path d="M 0 470 H 140 L 175 445 H 206" stroke="#1aa6a0"/>
  </g>
  <g>
    <circle cx="120" cy="180" r="9" fill="#2bd67b"/>
    <circle cx="150" cy="300" r="9" fill="#7dffb8"/>
    <circle cx="140" cy="470" r="9" fill="#1aa6a0"/>
  </g>

  <!-- handle -->
  <g transform="rotate(45 400 400)">
    <rect x="372" y="620" width="56" height="250" rx="22" fill="url(#handle)"/>
    <rect x="372" y="680" width="56" height="120" fill="url(#houndstooth)"/>
    <rect x="364" y="596" width="72" height="40" rx="10" fill="#2a4a3a"/>
  </g>

  <!-- lens -->
  <circle cx="400" cy="400" r="232" fill="#2bd67b" opacity="0.18" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="196" fill="url(#glass)"/>
  <g clip-path="url(#lens)">

    <!-- ===== rendered character (whole face; right half is covered by the analysis) ===== -->
    <g transform="translate(400 418) scale(0.8) translate(-400 -400)">
    <use href="#backHair" fill="url(#hair)"/>
    <path d="M 372 548 L 428 548 L 434 620 L 366 620 Z" fill="#9aab9a"/>
    <!-- high coat collar -->
    <path d="M 230 640 L 300 560 L 384 600 L 380 640 Z" fill="#0f2a1f"/>
    <path d="M 570 640 L 500 560 L 416 600 L 420 640 Z" fill="#0f2a1f"/>
    <path d="M 300 560 L 384 600 L 372 608 L 296 572 Z" fill="#1d4a36"/>
    <use href="#faceShape" fill="url(#skin)"/>
    <!-- cheek/jaw shading -->
    <path d="M 312 362 C 312 440, 330 500, 362 540 C 340 500, 326 440, 330 380 Z" fill="#7f9482" opacity="0.45"/>
    <!-- shadow under bangs -->
    <path d="M 312 360 L 488 360 L 488 420 C 440 400, 360 400, 312 420 Z" fill="#3c5a4a" opacity="0.35"/>
    <use href="#bangs" fill="url(#hair)"/>
    <path d="M 330 300 C 360 276, 420 270, 460 280" fill="none" stroke="#3f8c66" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- sharp brows -->
    <path d="M 316 404 L 388 394 L 386 402 L 322 414 Z" fill="#07140e"/>
    <path d="M 484 404 L 412 394 L 414 402 L 478 414 Z" fill="#07140e"/>
    <!-- eyes -->
    <use href="#eyeL" fill="#eef5ee"/>
    <use href="#eyeR" fill="#eef5ee"/>
    <ellipse cx="358" cy="426" rx="13" ry="16" fill="url(#iris)"/>
    <ellipse cx="442" cy="426" rx="13" ry="16" fill="url(#iris)"/>
    <ellipse cx="358" cy="428" rx="5" ry="8" fill="#03100a"/>
    <path d="M 350 418 L 356 414 L 354 424 L 348 426 Z" fill="#ffffff"/>
    <!-- upper lash lines -->
    <path d="M 314 434 C 328 408, 372 402, 394 418 L 390 424 C 370 410, 334 414, 318 436 Z" fill="#03100a"/>
    <path d="M 486 434 C 472 408, 428 402, 406 418 L 410 424 C 430 410, 466 414, 482 436 Z" fill="#03100a"/>
    <!-- nose, mouth -->
    <path d="M 401 466 L 394 484 L 402 486" fill="none" stroke="#6f8574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 384 516 C 394 520, 406 520, 416 514" fill="none" stroke="#4d6656" stroke-width="3.5" stroke-linecap="round"/>

    </g>

    <!-- ===== analysis overlay on the right half ===== -->
    <g clip-path="url(#rightHalf)">
      <rect x="400" y="190" width="220" height="420" fill="#03100a" opacity="0.93"/>
      <rect x="400" y="190" width="220" height="420" fill="url(#grid)" opacity="0.22"/>
      <g transform="translate(400 418) scale(0.8) translate(-400 -400)">
      <g fill="none" stroke="#2bd67b" stroke-width="2.5" filter="url(#lineglow)">
        <use href="#backHair" stroke-opacity="0.5"/>
        <use href="#faceShape"/>
        <use href="#bangs" stroke-opacity="0.7"/>
        <use href="#eyeR"/>
        <ellipse cx="442" cy="426" rx="13" ry="16"/>
        <path d="M 484 404 L 412 394 L 414 402 L 478 414 Z"/>
        <path d="M 401 466 L 394 484 L 402 486"/>
        <path d="M 384 516 C 394 520, 406 520, 416 514"/>
        <path d="M 416 600 L 500 560 L 570 640"/>
      </g>
      <!-- mesh contours -->
      <g fill="none" stroke="#2bd67b" stroke-width="1.5" opacity="0.45">
        <path d="M 400 380 C 440 378, 470 382, 488 390"/>
        <path d="M 400 456 C 440 456, 470 452, 486 444"/>
        <path d="M 400 494 C 432 494, 460 488, 478 478"/>
        <path d="M 400 532 C 422 532, 444 524, 458 512"/>
        <path d="M 440 360 C 446 420, 444 500, 428 552"/>
        <path d="M 470 362 C 478 420, 474 480, 458 514"/>
      </g>
      <!-- landmarks -->
      <g fill="#b6ffd5">
        <circle cx="410" cy="420" r="4.5"/><circle cx="482" cy="432" r="4.5"/><circle cx="442" cy="426" r="4.5"/>
        <circle cx="402" cy="486" r="4.5"/><circle cx="416" cy="514" r="4.5"/><circle cx="400" cy="570" r="4.5"/>
        <circle cx="478" cy="478" r="4.5"/><circle cx="488" cy="362" r="4.5"/><circle cx="458" cy="512" r="4.5"/>
      </g>
      <!-- target box on the eye -->
      <g fill="none" stroke="#b6ffd5" stroke-width="3">
        <path d="M 404 398 h 12 M 404 398 v 12"/>
        <path d="M 496 398 h -12 M 496 398 v 12"/>
        <path d="M 404 454 h 12 M 404 454 v -12"/>
        <path d="M 496 454 h -12 M 496 454 v -12"/>
      </g>
      </g>
      <text x="492" y="404" font-family="DejaVu Sans Mono" font-weight="700" font-size="15" fill="#b6ffd5">MATCH</text>
      <text x="492" y="422" font-family="DejaVu Sans Mono" font-weight="700" font-size="15" fill="#2bd67b">98.7%</text>
      <rect x="492" y="476" width="62" height="5" fill="#2bd67b" opacity="0.8"/>
      <rect x="492" y="488" width="44" height="5" fill="#2bd67b" opacity="0.5"/>
      <rect x="492" y="500" width="54" height="5" fill="#2bd67b" opacity="0.3"/>
    </g>

    <!-- scan line splitting the face -->
    <rect x="397" y="190" width="6" height="420" fill="#b6ffd5" filter="url(#lineglow)"/>
    <rect x="403" y="190" width="40" height="420" fill="#2bd67b" opacity="0.08"/>

    <!-- glass glare -->
    <path d="M 252 262 C 292 222, 352 208, 402 212 C 352 224, 302 248, 272 292 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <circle cx="400" cy="400" r="196" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="400" cy="400" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- wordmark -->
  <text x="890" y="500" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="680" y="530" width="420" height="6" rx="3" fill="url(#ring)"/>
  <text x="890" y="600" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#7fbf9b">ANIME MULTI SOURCE</text>
</svg>
