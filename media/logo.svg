<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2552"/>
      <stop offset="60%" stop-color="#273274"/>
      <stop offset="100%" stop-color="#3a2a82"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#8fb4ff" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4daf0"/>
    </linearGradient>
    <linearGradient id="armorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6498"/>
      <stop offset="100%" stop-color="#3a4170"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1230"/>
      <stop offset="100%" stop-color="#1a2150"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3cdf8"/>
    </linearGradient>
    <linearGradient id="streamFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4fd8ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.07"/>
  <path d="M 0 900 L 0 660 L 780 0 L 1200 0 L 1200 110 L 320 900 Z" fill="#ffffff" opacity="0.025"/>
  <ellipse cx="330" cy="420" rx="230" ry="230" fill="#4fd8ff" opacity="0.18" filter="url(#softglow)"/>

  <!-- ===== original mecha head (front view) ===== -->
  <g stroke="#1a1f3d" stroke-width="4" stroke-linejoin="round">
    <!-- shoulders / collar armour -->
    <!-- chest + pauldrons -->
    <path d="M 214 540 L 446 540 L 476 660 L 184 660 Z" fill="url(#armorDark)"/>
    <path d="M 270 548 L 390 548 L 404 620 L 330 646 L 256 620 Z" fill="url(#armor)"/>
    <path d="M 150 600 C 150 548, 186 520, 236 520 L 262 548 L 236 660 L 150 660 Z" fill="url(#armor)"/>
    <path d="M 510 600 C 510 548, 474 520, 424 520 L 398 548 L 424 660 L 510 660 Z" fill="url(#armor)"/>
    <path d="M 164 590 L 238 572 M 496 590 L 422 572" stroke="#ff9a3c" stroke-width="7" stroke-linecap="round"/>
    <!-- ribbed neck -->
    <path d="M 302 478 L 358 478 L 364 548 L 296 548 Z" fill="#3a4170"/>

    <!-- side sensor pods + antennas -->
    <path d="M 214 330 L 252 316 L 252 420 L 214 408 Z" fill="url(#armorDark)"/>
    <path d="M 446 330 L 408 316 L 408 420 L 446 408 Z" fill="url(#armorDark)"/>
    <path d="M 222 330 L 186 238" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 438 330 L 474 238" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="186" cy="238" r="7" fill="#ff9a3c"/>
    <circle cx="474" cy="238" r="7" fill="#ff9a3c"/>

    <!-- helmet -->
    <path d="M 252 296 L 288 238 L 372 238 L 408 296 L 418 404 L 388 478 L 272 478 L 242 404 Z" fill="url(#armor)"/>
    <!-- crest blade + base -->
    <path d="M 318 240 L 330 120 L 342 240 Z" fill="#ff9a3c"/>
    <path d="M 306 236 L 354 236 L 348 262 L 312 262 Z" fill="#e2e7f6"/>
    <!-- forehead panel -->
    <path d="M 286 266 L 312 262 L 348 262 L 374 266 L 380 298 L 280 298 Z" fill="#e2e7f6"/>
    <circle cx="330" cy="282" r="9" fill="#4fd8ff" stroke-width="3"/>

    <!-- visor with twin angular eye slits -->
    <path d="M 262 306 L 398 306 L 406 352 L 254 352 Z" fill="url(#visor)"/>
    <!-- cheek plates -->
    <path d="M 254 356 L 306 356 L 298 440 L 270 440 L 246 404 Z" fill="#c9d0ea"/>
    <path d="M 406 356 L 354 356 L 362 440 L 390 440 L 414 404 Z" fill="#c9d0ea"/>
    <!-- faceplate with horizontal vents -->
    <path d="M 306 356 L 354 356 L 362 444 L 298 444 Z" fill="url(#armorDark)"/>
    <path d="M 278 478 L 298 444 L 362 444 L 382 478 Z" fill="#e2e7f6"/>
  </g>
  <!-- neck ribs, chest core -->
  <g stroke="#7a84bb" stroke-width="3" stroke-linecap="round">
    <path d="M 304 496 H 356 M 302 514 H 358 M 300 532 H 360"/>
  </g>
  <path d="M 330 574 L 346 592 L 330 610 L 314 592 Z" fill="#7ff0ff" stroke="#1a1f3d" stroke-width="3" filter="url(#glow)"/>
  <!-- glowing eyes -->
  <g fill="#7ff0ff" filter="url(#glow)">
    <path d="M 268 318 L 318 326 L 314 340 L 272 334 Z"/>
    <path d="M 392 318 L 342 326 L 346 340 L 388 334 Z"/>
  </g>
  <g stroke="#9fb0e6" stroke-width="3" stroke-linecap="round">
    <path d="M 312 372 H 348 M 310 390 H 350 M 308 408 H 352 M 306 426 H 354"/>
  </g>
  <!-- panel lines -->
  <g fill="none" stroke="#9aa3cc" stroke-width="2.5" stroke-linecap="round">
    <path d="M 262 380 L 288 380 M 398 380 L 372 380"/>
    <path d="M 296 252 L 288 280 M 364 252 L 372 280"/>
  </g>

  <!-- ===== digital analysis ===== -->
  <!-- wireframe edge trace -->
  <path d="M 244 290 L 284 228 L 376 228 L 416 290 L 428 404 L 394 488 L 266 488 L 232 404 Z" fill="none" stroke="#4fd8ff" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <!-- scan frame -->
  <g fill="none" stroke="#e2f8ff" stroke-width="5" stroke-linecap="round">
    <path d="M 136 140 h 46 M 136 140 v 46"/>
    <path d="M 524 140 h -46 M 524 140 v 46"/>
    <path d="M 136 676 h 46 M 136 676 v -46"/>
    <path d="M 524 676 h -46 M 524 676 v -46"/>
  </g>
  <!-- scan line across the eyes -->
  <rect x="150" y="327" width="360" height="3" fill="#e2f8ff" filter="url(#glow)"/>
  <rect x="150" y="330" width="360" height="40" fill="#4fd8ff" opacity="0.08"/>

  <!-- metadata tags pinned to the mecha -->
  <g font-family="DejaVu Sans Mono" font-weight="700" font-size="17">
    <!-- crest -> AniList -->
    <path d="M 330 128 L 382 96 L 440 96" fill="none" stroke="#e2f8ff" stroke-width="2.5"/>
    <circle cx="330" cy="128" r="5.5" fill="#ff9a3c" stroke="#e2f8ff" stroke-width="2"/>
    <rect x="440" y="78" width="168" height="36" rx="18" fill="#0f1536" stroke="#4fd8ff" stroke-width="2"/>
    <text x="458" y="102" fill="#e2f8ff">ANILIST <tspan fill="#4fd8ff">21519</tspan></text>

    <!-- eye -> AniDB -->
    <path d="M 272 328 L 210 286 L 182 286" fill="none" stroke="#e2f8ff" stroke-width="2.5"/>
    <circle cx="272" cy="328" r="5.5" fill="#4fd8ff" stroke="#e2f8ff" stroke-width="2"/>
    <rect x="18" y="268" width="164" height="36" rx="18" fill="#0f1536" stroke="#4fd8ff" stroke-width="2"/>
    <text x="36" y="292" fill="#e2f8ff">ANIDB <tspan fill="#4fd8ff">17041</tspan></text>

    <!-- cheek -> MAL -->
    <path d="M 392 420 L 452 450 L 470 450" fill="none" stroke="#e2f8ff" stroke-width="2.5"/>
    <circle cx="392" cy="420" r="5.5" fill="#4fd8ff" stroke="#e2f8ff" stroke-width="2"/>
    <rect x="470" y="432" width="146" height="36" rx="18" fill="#0f1536" stroke="#4fd8ff" stroke-width="2"/>
    <text x="488" y="456" fill="#e2f8ff">MAL <tspan fill="#4fd8ff">50594</tspan></text>

    <!-- collar -> tags/cast -->
    <path d="M 200 580 L 160 640 L 160 672" fill="none" stroke="#e2f8ff" stroke-width="2.5"/>
    <circle cx="200" cy="580" r="5.5" fill="#ff9a3c" stroke="#e2f8ff" stroke-width="2"/>
    <rect x="20" y="672" width="210" height="36" rx="18" fill="#0f1536" stroke="#ff9a3c" stroke-width="2"/>
    <text x="40" y="696" fill="#e2f8ff">TAGS <tspan fill="#ff9a3c">31</tspan> · CAST <tspan fill="#ff9a3c">54</tspan></text>
  </g>

  <!-- compiling data stream: packets + hex flowing into the wordmark -->
  <g>
    <g fill="url(#streamFade)">
      <rect x="520" y="300" width="22" height="7" rx="3.5"/><rect x="552" y="300" width="40" height="7" rx="3.5"/><rect x="602" y="300" width="14" height="7" rx="3.5"/><rect x="626" y="300" width="30" height="7" rx="3.5"/>
      <rect x="512" y="350" width="36" height="7" rx="3.5"/><rect x="558" y="350" width="18" height="7" rx="3.5"/><rect x="586" y="350" width="46" height="7" rx="3.5"/><rect x="642" y="350" width="16" height="7" rx="3.5"/>
      <rect x="530" y="400" width="16" height="7" rx="3.5"/><rect x="556" y="400" width="34" height="7" rx="3.5"/><rect x="600" y="400" width="24" height="7" rx="3.5"/><rect x="634" y="400" width="24" height="7" rx="3.5"/>
    </g>
    <g font-family="DejaVu Sans Mono" font-size="13" fill="#9fdcff" opacity="0.75">
      <text x="522" y="292">0x3F A1 7C</text>
      <text x="522" y="342">E4 09 B2 5D</text>
      <text x="530" y="392">1A 6E FF 02</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="910" y="470" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="700" y="500" width="420" height="6" rx="3" fill="url(#accent)"/>
  <text x="910" y="566" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#c3cdf5">ANIME MULTI SOURCE</text>

  <!-- compiling progress -->
  <g font-family="DejaVu Sans Mono" font-weight="700" font-size="17">
    <text x="700" y="626" fill="#9fdcff">COMPILING METADATA</text>
    <text x="1120" y="626" text-anchor="end" fill="#e2f8ff">87%</text>
    <rect x="700" y="640" width="420" height="12" rx="6" fill="#0f1536" stroke="#4fd8ff" stroke-width="1.5"/>
    <rect x="702" y="642" width="363" height="8" rx="4" fill="url(#accent)"/>
  </g>
</svg>
