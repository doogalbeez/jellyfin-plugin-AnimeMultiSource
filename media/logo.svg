<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2756"/>
      <stop offset="60%" stop-color="#29357a"/>
      <stop offset="100%" stop-color="#3d2c86"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#8fa3ff"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 H 0 V 16" fill="none" stroke="#4fd8ff" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <radialGradient id="glass" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a5ca8"/>
      <stop offset="100%" stop-color="#1f2a5e"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8da"/>
      <stop offset="100%" stop-color="#f0cdb8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb366"/>
      <stop offset="55%" stop-color="#ec7a33"/>
      <stop offset="100%" stop-color="#b9471d"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#bff4ff"/>
      <stop offset="40%" stop-color="#2fb6f0"/>
      <stop offset="100%" stop-color="#1d2f8a"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c7ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e4677"/>
      <stop offset="50%" stop-color="#6c76b4"/>
      <stop offset="100%" stop-color="#3e4677"/>
    </linearGradient>
    <pattern id="houndstooth" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#3b2a6a"/>
      <path d="M0 0 h12 v12 h-12 Z M12 12 h12 v12 h-12 Z" fill="#241a45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pEyeL"><path d="M 322 440 C 324 418, 366 412, 376 434 C 372 454, 334 460, 322 440 Z"/></clipPath>
    <clipPath id="pEyeR"><path d="M 420 442 C 424 414, 476 408, 488 434 C 484 460, 434 466, 420 442 Z"/></clipPath>
    <clipPath id="lens"><circle cx="400" cy="400" r="196"/></clipPath>
    <clipPath id="rightHalf"><rect x="400" y="180" width="220" height="440"/></clipPath>
    <clipPath id="lensL"><circle cx="356" cy="424" r="40"/></clipPath>

    <!-- original boy-detective, front view -->
    <path id="faceShape" d="M 310 352 C 306 452, 340 530, 400 560 C 460 530, 494 452, 490 352 C 470 318, 330 318, 310 352 Z"/>
    <path id="backHair" d="M 268 364 C 246 214, 554 214, 532 364 L 530 446 C 516 424, 506 402, 498 382 L 302 382 C 294 402, 284 424, 270 446 Z"/>
    <path id="cowlick" d="M 404 236 C 420 186, 462 172, 478 194 C 452 194, 432 210, 422 240 Z"/>
    <path id="bangs" d="M 284 334 C 298 248, 502 248, 516 334 L 508 386 L 482 338 L 470 394 L 442 330 L 422 386 L 404 326 L 380 388 L 360 334 L 338 394 L 318 342 L 298 388 Z"/>
    <path id="eyeL" d="M 318 432 C 320 402, 386 394, 394 420 C 392 448, 330 454, 318 432 Z"/>
    <path id="eyeR" d="M 482 432 C 480 402, 414 394, 406 420 C 408 448, 470 454, 482 432 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.07"/>
  <path d="M 0 900 L 0 640 L 760 0 L 1200 0 L 1200 120 L 300 900 Z" fill="#ffffff" opacity="0.025"/>

  <!-- data lines feeding the lens -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 0 180 H 120 L 180 240 H 272" stroke="#00A4DC"/>
    <path d="M 0 300 H 150 L 190 330 H 208" stroke="#AA5CC3"/>
    <path d="M 0 470 H 140 L 175 445 H 206" stroke="#ff8a9b"/>
  </g>
  <g>
    <circle cx="120" cy="180" r="9" fill="#00A4DC"/>
    <circle cx="150" cy="300" r="9" fill="#AA5CC3"/>
    <circle cx="140" cy="470" r="9" fill="#ff8a9b"/>
  </g>

  <!-- handle -->
  <g transform="rotate(45 400 400)">
    <rect x="372" y="620" width="56" height="250" rx="22" fill="url(#handle)"/>
    <rect x="372" y="680" width="56" height="120" fill="url(#houndstooth)"/>
    <rect x="364" y="596" width="72" height="40" rx="10" fill="#6c76b4"/>
  </g>

  <!-- lens -->
  <circle cx="400" cy="400" r="232" fill="#00A4DC" opacity="0.22" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="196" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <g transform="translate(400 404) scale(0.86) translate(-400 -440) rotate(-5 400 440)">
      <!-- coat: shoulders, lapels with gold edge, open shirt -->
      <path d="M 196 690 C 206 616, 252 576, 340 556 L 384 690 Z" fill="#34449a" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 604 690 C 594 616, 548 576, 460 556 L 416 690 Z" fill="#34449a" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 340 556 L 400 632 L 460 556 L 452 690 L 348 690 Z" fill="#f7f8fc" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 340 556 L 308 606 L 356 628 Z" fill="#283680" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 460 556 L 492 606 L 444 628 Z" fill="#283680" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 340 556 L 384 690 M 460 556 L 416 690" stroke="#f5c542" stroke-width="6" stroke-linecap="round"/>
      <path d="M 252 600 C 270 590, 290 584, 310 582 M 548 600 C 530 590, 510 584, 490 582" fill="none" stroke="#f5c542" stroke-width="4" stroke-linecap="round"/>

      <!-- neck -->
      <path d="M 374 506 L 428 506 L 432 584 C 414 600, 390 600, 370 584 Z" fill="#e8bea7" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- side hair under the bandana -->
      <path d="M 296 334 C 270 384, 266 444, 288 492 L 306 470 L 300 506 L 330 470 L 318 432 L 330 444 L 322 388 Z" fill="url(#hair)" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 508 334 C 538 380, 548 440, 528 488 L 512 468 L 516 502 L 488 466 L 500 430 L 486 442 L 494 388 Z" fill="url(#hair)" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- ear + earring -->
      <ellipse cx="514" cy="442" rx="15" ry="24" fill="#f6d8c6" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 516 430 C 508 436, 508 450, 516 456" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="512" cy="472" r="8" fill="none" stroke="#f5c542" stroke-width="4.5"/>

      <!-- face -->
      <path d="M 300 350 C 294 440, 320 502, 372 542 C 396 558, 424 558, 446 542 C 492 506, 514 452, 510 350 Z" fill="url(#skin)" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 304 380 C 302 444, 324 498, 366 532 C 342 494, 328 446, 330 392 Z" fill="#e2b29b" opacity="0.35"/>
      <ellipse cx="334" cy="490" rx="18" ry="9" fill="#f29a8c" opacity="0.35"/>
      <ellipse cx="478" cy="490" rx="20" ry="10" fill="#f29a8c" opacity="0.35"/>

      <!-- bangs: varied curved strands -->
      <path d="M 294 360 C 298 318, 330 300, 362 298 L 402 298 C 444 298, 488 306, 514 348
               L 508 396 C 500 376, 490 362, 478 354 C 476 374, 470 388, 458 398 C 456 380, 450 364, 438 354
               C 432 372, 420 386, 406 392 C 408 374, 404 362, 396 352 C 388 368, 376 382, 360 388
               C 364 372, 364 362, 358 352 C 348 368, 336 380, 320 386 C 326 372, 326 362, 322 358
               C 314 370, 306 382, 298 398 Z" fill="url(#hair)" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 428 316 C 444 318, 460 326, 470 338 M 372 316 C 360 320, 348 330, 342 340" fill="none" stroke="#ffd9a8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

      <!-- bandana: knot + tails, dome, rim, folds, emblem -->
      <path d="M 520 344 C 548 356, 564 384, 560 420 C 548 400, 536 386, 518 376 Z" fill="#1f9fae" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 522 336 C 556 336, 580 358, 588 388 C 570 372, 550 362, 526 360 Z" fill="#2bb8c8" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 284 356 C 278 272, 336 224, 406 222 C 476 222, 530 270, 522 354 C 468 334, 340 334, 284 356 Z" fill="#2bb8c8" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 284 356 C 340 334, 468 334, 522 354 L 520 334 C 466 314, 340 314, 287 336 Z" fill="#1f9fae" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 330 252 C 356 238, 390 232, 420 234 M 476 262 C 492 278, 500 298, 502 318" fill="none" stroke="#1a8b98" stroke-width="3" stroke-linecap="round"/>
      <path d="M 318 268 C 340 246, 376 234, 404 232" fill="none" stroke="#a8f2f8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="522" cy="344" r="13" fill="#1f9fae" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <g transform="translate(404 280) scale(0.9)">
        <path d="M -22 18 L 22 34 M 22 18 L -22 34" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="17" fill="#ffffff"/>
        <rect x="-9" y="10" width="18" height="11" rx="3" fill="#ffffff"/>
        <circle cx="-6" cy="-1" r="4.5" fill="#1a8b98"/><circle cx="6" cy="-1" r="4.5" fill="#1a8b98"/>
        <path d="M -4 16 v 5 M 0 16 v 5 M 4 16 v 5" stroke="#1a8b98" stroke-width="1.6"/>
      </g>

      <!-- brows -->
      <path d="M 320 402 C 336 392, 358 392, 376 402 L 374 410 C 358 402, 338 402, 322 410 Z" fill="#a13d17"/>
      <path d="M 486 398 C 466 388, 442 388, 422 400 L 425 408 C 444 398, 466 398, 484 406 Z" fill="#a13d17"/>

      <!-- eyes: almond, clipped iris, defined lids -->
      <path d="M 322 440 C 324 418, 366 412, 376 434 C 372 454, 334 460, 322 440 Z" fill="#ffffff"/>
      <path d="M 420 442 C 424 414, 476 408, 488 434 C 484 460, 434 466, 420 442 Z" fill="#ffffff"/>
      <g clip-path="url(#pEyeL)">
        <ellipse cx="351" cy="437" rx="14" ry="17" fill="url(#iris)"/>
        <circle cx="351" cy="438" r="6" fill="#0a0f2a"/>
        <circle cx="346" cy="432" r="3.5" fill="#ffffff"/><circle cx="356" cy="444" r="1.8" fill="#ffffff"/>
      </g>
      <g clip-path="url(#pEyeR)">
        <ellipse cx="454" cy="438" rx="17" ry="20" fill="url(#iris)"/>
        <circle cx="454" cy="439" r="7" fill="#0a0f2a"/>
        <circle cx="448" cy="432" r="4" fill="#ffffff"/><circle cx="460" cy="446" r="2" fill="#ffffff"/>
      </g>
      <path d="M 318 442 C 322 416, 366 408, 380 432" fill="none" stroke="#2a1f3d" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M 416 444 C 420 412, 476 404, 492 432" fill="none" stroke="#2a1f3d" stroke-width="6" stroke-linecap="round"/>
      <path d="M 330 452 C 342 458, 360 458, 370 450 M 432 456 C 446 464, 470 462, 482 452" fill="none" stroke="#2a1f3d" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

      <!-- nose -->
      <path d="M 396 466 C 392 474, 388 480, 390 484 C 394 486, 400 485, 404 482" fill="none" stroke="#c48f78" stroke-width="2.5" stroke-linecap="round"/>

      <!-- grin -->
      <path d="M 360 502 C 382 514, 428 514, 452 498 C 448 536, 370 540, 360 502 Z" fill="#7a2630" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 363 504 C 384 515, 426 515, 449 501 L 447 512 C 424 524, 384 524, 366 514 Z" fill="#ffffff"/>
      <path d="M 388 528 C 400 534, 416 534, 428 526 C 416 520, 400 520, 388 528 Z" fill="#e66a5f"/>
    </g>

    <!-- analysis: deliberate landmarks + light mesh (same transform) -->
    <g transform="translate(400 404) scale(0.86) translate(-400 -440) rotate(-5 400 440)">
      <g fill="none" stroke="#4fd8ff" stroke-width="1.6" opacity="0.5" stroke-linejoin="round">
        <path d="M 322 406 L 374 406 L 424 404 L 484 402"/>
        <path d="M 322 440 L 376 434 M 420 442 L 488 434"/>
        <path d="M 374 406 L 392 482 L 424 404"/>
        <path d="M 360 502 L 392 482 L 452 498"/>
        <path d="M 360 502 L 404 552 L 452 498"/>
        <path d="M 302 400 L 322 440 L 330 500 L 360 502"/>
        <path d="M 508 400 L 488 434 L 494 478 L 452 498"/>
        <path d="M 330 500 L 404 552 L 494 478"/>
      </g>
      <g fill="#e2f8ff" stroke="#4fd8ff" stroke-width="2">
        <circle cx="322" cy="406" r="4.5"/><circle cx="374" cy="406" r="4.5"/><circle cx="424" cy="404" r="4.5"/><circle cx="484" cy="402" r="4.5"/>
        <circle cx="322" cy="440" r="4.5"/><circle cx="376" cy="434" r="4.5"/><circle cx="420" cy="442" r="4.5"/><circle cx="488" cy="434" r="4.5"/>
        <circle cx="392" cy="482" r="4.5"/>
        <circle cx="360" cy="502" r="4.5"/><circle cx="452" cy="498" r="4.5"/><circle cx="404" cy="552" r="4.5"/>
        <circle cx="330" cy="500" r="4"/><circle cx="494" cy="478" r="4"/><circle cx="302" cy="400" r="4"/><circle cx="508" cy="400" r="4"/>
        <circle cx="514" cy="442" r="4"/>
      </g>
      <g fill="none" stroke="#e2f8ff" stroke-width="3">
        <path d="M 412 400 h 14 M 412 400 v 14"/>
        <path d="M 498 400 h -14 M 498 400 v 14"/>
        <path d="M 412 476 h 14 M 412 476 v -14"/>
        <path d="M 498 476 h -14 M 498 476 v -14"/>
      </g>
    </g>

    <!-- scan band across the eye line -->
    <rect x="200" y="402" width="400" height="3" fill="#e2f8ff" opacity="0.9" filter="url(#lineglow)"/>
    <rect x="200" y="405" width="400" height="28" fill="#4fd8ff" opacity="0.07"/>

    <!-- glass glare -->
    <path d="M 252 262 C 292 222, 352 208, 402 212 C 352 224, 302 248, 272 292 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <circle cx="400" cy="400" r="196" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="400" cy="400" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>


  <!-- readout tagged to the face, outside the lens -->
  <g>
    <path d="M 476 372 L 548 252 L 566 252" fill="none" stroke="#e2f8ff" stroke-width="2.5"/>
    <circle cx="476" cy="372" r="5" fill="#e2f8ff"/>
    <rect x="566" y="222" width="104" height="58" rx="8" fill="#070b1c" opacity="0.9" stroke="#4fd8ff" stroke-width="2"/>
    <text x="578" y="246" font-family="DejaVu Sans Mono" font-weight="700" font-size="17" fill="#d6f6ff">MATCH</text>
    <text x="578" y="268" font-family="DejaVu Sans Mono" font-weight="700" font-size="17" fill="#4fd8ff">98.7%</text>
  </g>
  <!-- wordmark -->
  <text x="890" y="500" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="680" y="530" width="420" height="6" rx="3" fill="url(#ring)"/>
  <text x="890" y="600" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#c3cdf5">ANIME MULTI SOURCE</text>
</svg>
