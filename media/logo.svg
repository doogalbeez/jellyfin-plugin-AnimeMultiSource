<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="60%" stop-color="#141433"/>
      <stop offset="100%" stop-color="#1d1040"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#8fa3ff"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <radialGradient id="glass" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b2a55"/>
      <stop offset="100%" stop-color="#080d1f"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#9ff0ff"/>
      <stop offset="40%" stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#2b1b6b"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c7ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2f52"/>
      <stop offset="50%" stop-color="#4a5285"/>
      <stop offset="100%" stop-color="#2a2f52"/>
    </linearGradient>
    <pattern id="houndstooth" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#3b2a6a"/>
      <path d="M0 0 h12 v12 h-12 Z M12 12 h12 v12 h-12 Z" fill="#241a45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="lens"><circle cx="400" cy="400" r="196"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.07"/>
  <path d="M 0 900 L 0 640 L 760 0 L 1200 0 L 1200 120 L 300 900 Z" fill="#ffffff" opacity="0.025"/>

  <!-- data lines feeding the lens (separate sources) -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 0 180 H 120 L 180 240 H 272" stroke="#00A4DC"/>
    <path d="M 0 300 H 150 L 190 330 H 208" stroke="#AA5CC3"/>
    <path d="M 0 470 H 140 L 175 445 H 206" stroke="#5ff2d0"/>
  </g>
  <g>
    <circle cx="120" cy="180" r="9" fill="#00A4DC"/>
    <circle cx="150" cy="300" r="9" fill="#AA5CC3"/>
    <circle cx="140" cy="470" r="9" fill="#5ff2d0"/>
  </g>

  <!-- magnifying glass: handle (houndstooth band - a deerstalker nod) -->
  <g transform="rotate(45 400 400)">
    <rect x="372" y="620" width="56" height="250" rx="22" fill="url(#handle)"/>
    <rect x="372" y="680" width="56" height="120" fill="url(#houndstooth)"/>
    <rect x="364" y="596" width="72" height="40" rx="10" fill="#4a5285"/>
  </g>

  <!-- lens -->
  <circle cx="400" cy="400" r="232" fill="#00A4DC" opacity="0.25" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="196" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <!-- reticle -->
    <g stroke="#7fe3ff" stroke-opacity="0.35" stroke-width="3">
      <line x1="400" y1="210" x2="400" y2="262"/><line x1="400" y1="538" x2="400" y2="590"/>
      <line x1="210" y1="400" x2="262" y2="400"/><line x1="538" y1="400" x2="590" y2="400"/>
    </g>
    <circle cx="400" cy="400" r="150" fill="none" stroke="#7fe3ff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- sharp, half-lidded anime eye: focused, not cute -->
    <g transform="rotate(-8 400 410)">
      <path d="M 250 420 C 300 360, 420 336, 556 384 C 500 452, 380 470, 250 420 Z" fill="#e9eeff"/>
      <clipPath id="eye"><path d="M 250 420 C 300 360, 420 336, 556 384 C 500 452, 380 470, 250 420 Z"/></clipPath>
      <g clip-path="url(#eye)">
        <ellipse cx="420" cy="410" rx="62" ry="78" fill="url(#iris)"/>
        <ellipse cx="420" cy="414" rx="20" ry="34" fill="#0a0820"/>
        <path d="M 250 330 L 560 330 L 560 392 C 470 368, 360 372, 250 410 Z" fill="#0a0820" opacity="0.35"/>
        <path d="M 392 372 L 410 362 L 404 392 L 386 400 Z" fill="#ffffff"/>
        <circle cx="448" cy="440" r="5" fill="#ffffff" opacity="0.9"/>
      </g>
      <!-- heavy angular upper lash line with a sharp flick -->
      <path d="M 236 428 C 292 350, 430 322, 586 368 L 556 386 C 420 340, 300 362, 250 420 Z" fill="#0a0820"/>
      <path d="M 520 352 L 600 338 L 556 386 Z" fill="#0a0820"/>
      <path d="M 300 450 C 380 466, 470 452, 528 418" fill="none" stroke="#0a0820" stroke-width="5" stroke-linecap="round"/>
      <!-- sharp brow -->
      <path d="M 268 336 C 340 300, 440 282, 532 286 L 540 296 C 450 300, 360 318, 292 346 Z" fill="#0a0820" opacity="0.95"/>
    </g>
    <!-- glass glare -->
    <path d="M 260 260 C 300 220, 360 206, 410 210 C 360 222, 310 246, 280 290 Z" fill="#ffffff" opacity="0.22"/>
  </g>
  <circle cx="400" cy="400" r="196" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="400" cy="400" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- wordmark -->
  <text x="890" y="500" text-anchor="middle" font-family="Fira Sans" font-weight="900" font-size="230" letter-spacing="-4" fill="url(#word)">AMS</text>
  <rect x="680" y="530" width="420" height="6" rx="3" fill="url(#ring)"/>
  <text x="890" y="600" text-anchor="middle" font-family="Fira Sans" font-weight="600" font-size="38" letter-spacing="7" fill="#9fb0e6">ANIME MULTI SOURCE</text>
</svg>
