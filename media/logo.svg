<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#252a5c"/>
      <stop offset="70%" stop-color="#14173a"/>
      <stop offset="100%" stop-color="#0b0d24"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7fe3ff"/>
      <stop offset="35%" stop-color="#00A4DC"/>
      <stop offset="75%" stop-color="#7a4fc9"/>
      <stop offset="100%" stop-color="#3a1f6e"/>
    </radialGradient>
    <linearGradient id="irisShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f3a" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#1a0f3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="lidShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160b33" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#160b33" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="eyeClip2">
      <path d="M 290 540 C 330 430, 460 395, 560 400 C 660 405, 730 440, 770 500 C 730 590, 640 642, 520 642 C 420 642, 340 612, 290 540 Z"/>
    </clipPath>
    <clipPath id="eyeClip">
      <path d="M262 520 C 340 392, 684 392, 762 520 C 684 640, 340 640, 262 520 Z"/>
    </clipPath>
    <!-- data streams fade toward the eye -->
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00A4DC" stop-opacity="0.15"/><stop offset="100%" stop-color="#00A4DC"/></linearGradient>
    <linearGradient id="s2" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#AA5CC3" stop-opacity="0.15"/><stop offset="100%" stop-color="#AA5CC3"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ff7eb6" stop-opacity="0.45"/><stop offset="100%" stop-color="#ff7eb6"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffc861" stop-opacity="0.15"/><stop offset="100%" stop-color="#ffc861"/></linearGradient>
    <linearGradient id="s5" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5ff2d0" stop-opacity="0.15"/><stop offset="100%" stop-color="#5ff2d0"/></linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="512" cy="512" r="490" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="474" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.9"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- converging data streams: separate sources flowing into one -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M118 330 C 230 330, 260 440, 312 500" stroke="url(#s1)"/>
    <path d="M906 330 C 820 330, 790 420, 752 470" stroke="url(#s2)"/>
    <path d="M512 948 C 512 820, 516 720, 520 650" stroke="url(#s3)"/>
    <path d="M190 780 C 260 700, 300 640, 352 590" stroke="url(#s4)"/>
    <path d="M834 780 C 774 700, 744 640, 712 600" stroke="url(#s5)"/>
  </g>
  <g>
    <circle cx="118" cy="330" r="16" fill="#00A4DC"/><circle cx="216" cy="350" r="9" fill="#00A4DC" opacity="0.7"/>
    <circle cx="906" cy="330" r="16" fill="#AA5CC3"/><circle cx="808" cy="350" r="9" fill="#AA5CC3" opacity="0.7"/>
    <circle cx="512" cy="948" r="16" fill="#ff7eb6"/><circle cx="512" cy="840" r="9" fill="#ff7eb6" opacity="0.7"/>
    <circle cx="190" cy="780" r="16" fill="#ffc861"/><circle cx="252" cy="712" r="9" fill="#ffc861" opacity="0.7"/>
    <circle cx="834" cy="780" r="16" fill="#5ff2d0"/><circle cx="772" cy="712" r="9" fill="#5ff2d0" opacity="0.7"/>
  </g>

  <!-- glow behind the eye -->
  <ellipse cx="530" cy="520" rx="270" ry="160" fill="#00A4DC" opacity="0.35" filter="url(#softglow)"/>

  <!-- anime eye: sclera -->
  <path d="M 290 540 C 330 430, 460 395, 560 400 C 660 405, 730 440, 770 500 C 730 590, 640 642, 520 642 C 420 642, 340 612, 290 540 Z" fill="url(#sclera)"/>
  <g clip-path="url(#eyeClip2)">
    <!-- tall oval iris -->
    <ellipse cx="535" cy="525" rx="120" ry="146" fill="url(#iris)"/>
    <ellipse cx="535" cy="525" rx="120" ry="146" fill="url(#irisShade)"/>
    <!-- scan ring: identifying -->
    <ellipse cx="535" cy="530" rx="90" ry="110" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="18 13"/>
    <!-- play-button pupil -->
    <path d="M 505 470 L 600 530 L 505 590 Z" fill="#160b33" stroke="#160b33" stroke-width="16" stroke-linejoin="round"/>
    <!-- anime highlights -->
    <ellipse cx="482" cy="468" rx="38" ry="26" fill="#ffffff" transform="rotate(-30 482 468)"/>
    <circle cx="596" cy="600" r="13" fill="#ffffff" opacity="0.95"/>
    <!-- lid shadow on the eye -->
    <rect x="280" y="390" width="500" height="260" fill="url(#lidShadow)"/>
  </g>
  <!-- heavy upper lash with winged flick -->
  <path d="M 266 556 C 296 410, 452 358, 570 364 C 690 370, 772 416, 838 446 L 784 488 C 730 440, 660 405, 560 400 C 460 395, 330 430, 290 540 Z" fill="#160b33"/>
  <!-- lash spikes -->
  <g fill="#160b33">
    <path d="M 700 388 L 742 350 L 722 400 Z"/>
    <path d="M 752 414 L 800 388 L 770 430 Z"/>
  </g>
  <!-- lower lid -->
  <path d="M 420 640 C 520 652, 640 636, 726 584" fill="none" stroke="#160b33" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <path d="M 726 584 L 752 596" stroke="#160b33" stroke-width="7" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <path d="M 812 268 l 10 28 l 28 10 l -28 10 l -10 28 l -10 -28 l -28 -10 l 28 -10 Z"/>
    <path d="M 250 280 l 7 18 l 18 7 l -18 7 l -7 18 l -7 -18 l -18 -7 l 18 -7 Z" opacity="0.85"/>
    <path d="M 660 760 l 5 13 l 13 5 l -13 5 l -5 13 l -5 -13 l -13 -5 l 13 -5 Z" opacity="0.7"/>
  </g>

  <!-- sakura petals -->
  <g fill="#ffa9cf">
    <path d="M 0 -26 L 8 -36 C 22 -34 24 -12 16 6 C 10 18 4 28 0 36 C -4 28 -10 18 -16 6 C -24 -12 -22 -34 -8 -36 Z" transform="translate(700 206) rotate(35) scale(1.25)" opacity="0.95"/>
    <path d="M 0 -26 L 8 -36 C 22 -34 24 -12 16 6 C 10 18 4 28 0 36 C -4 28 -10 18 -16 6 C -24 -12 -22 -34 -8 -36 Z" transform="translate(338 812) rotate(-40) scale(1.0)" opacity="0.8"/>
    <path d="M 0 -26 L 8 -36 C 22 -34 24 -12 16 6 C 10 18 4 28 0 36 C -4 28 -10 18 -16 6 C -24 -12 -22 -34 -8 -36 Z" transform="translate(860 610) rotate(70) scale(0.75)" opacity="0.75"/>
    <path d="M 0 -26 L 8 -36 C 22 -34 24 -12 16 6 C 10 18 4 28 0 36 C -4 28 -10 18 -16 6 C -24 -12 -22 -34 -8 -36 Z" transform="translate(176 560) rotate(-15) scale(0.6)" opacity="0.6"/>
  </g>
</svg>
